minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.104.2'
  - '@tanstack/react-query@5.104.2'
  - zod@4.6.6

saveExact: true
overrides:
  '@prisma/config>deepmerge-ts': 8.0.2
  'prisma>mysql2': 3.24.5
  braces: file:./vendor/braces-compat

patchedDependencies:
  '@dieub/braces-depth-guard@3.0.3-pn.3': patches/braces-depth-guard.patch

allowBuilds:
  '@prisma/engines': true
  prisma: true
  sharp: true
  esbuild: true
  '@tailwindcss/oxide': true
  '@parcel/watcher': true
  '@swc/core': true
  unrs-resolver: true
